<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hamad Studio Legal</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #fad7df 0, transparent 35%),
        radial-gradient(circle at 80% 30%, #d7ccff 0, transparent 35%),
        radial-gradient(circle at 50% 90%, #b7d2ff 0, transparent 40%),
        #f7f8fc;
      color: #171719;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: min(700px, calc(100% - 40px));
      background: rgba(255,255,255,.84);
      border: 1px solid rgba(23,23,25,.08);
      border-radius: 28px;
      padding: 48px;
      box-shadow: 0 20px 60px rgba(0,0,0,.07);
      backdrop-filter: blur(20px);
    }

    h1 {
      margin-top: 0;
      font-size: 42px;
    }

    p {
      color: #57575f;
      line-height: 1.7;
    }

    .links {
      display: grid;
      gap: 12px;
      margin-top: 32px;
    }

    a {
      text-decoration: none;
      color: #171719;
      background: white;
      border: 1px solid rgba(23,23,25,.08);
      padding: 18px 20px;
      border-radius: 16px;
      font-weight: 600;
    }

    a:hover {
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 32px;
      font-size: 13px;
      color: #85858d;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hamad Studio ✦</h1>

    <p>
      Legal information for the Hamad Studio Discord application.
    </p>

    <div class="links">
      <a href="./terms.html">Terms of Service →</a>
      <a href="./privacy.html">Privacy Policy →</a>
    </div>

    <div class="footer">
      Hamad Studio • Create · Connect · Inspire
    </div>
  </main>
</body>
</html>
